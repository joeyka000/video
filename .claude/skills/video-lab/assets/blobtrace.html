<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blobtrace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&display=swap">
<style>
/* layout: 全高儀器面板 — 左邊畫面（canvas + 狀態列 + 錄製結果），右邊控制架；860px 以下改為上下排列 */
:root {
  --bg: #0b0d10;
  --panel: #111419;
  --panel-2: #161a20;
  --line: #232932;
  --line-2: #313944;
  --fg: #dde3ea;
  --muted: #8591a0;
  --dim: #5a6571;
  --accent: #a6e9ff;
  --accent-ink: #062631;
  --rec: #ff5468;
  --f-ui: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --f-alt: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --f-brand: "Silkscreen", "JetBrains Mono", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 12px/1.45 var(--f-ui); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: flex; flex-direction: column; min-height: 0; }
.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding-block: 10px; padding-inline: 16px; border-bottom: 1px solid var(--line); background: var(--panel);
}
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; min-width: 0; }
.mark { font-family: var(--f-brand); font-size: 20px; letter-spacing: .08em; color: var(--fg); }
.mark b { color: var(--accent); font-weight: 400; }
.sub { color: var(--muted); font-size: 11px; letter-spacing: .06em; }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--line-2); background: var(--panel-2); padding: 6px 12px; border-radius: 3px;
  letter-spacing: .04em; transition: border-color .12s, background .12s;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.rec { border-color: var(--rec); color: var(--rec); }
.btn.rec[aria-pressed="true"] { background: var(--rec); color: #1a0205; }
.btn.small { padding: 4px 8px; font-size: 11px; }

.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 356px; }
.stage-col { min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: auto; }
.stage {
  position: relative; flex: 1; min-height: 240px; display: flex; align-items: center; justify-content: center;
  padding: 16px; background:
    linear-gradient(var(--bg), var(--bg)) padding-box,
    repeating-linear-gradient(90deg, transparent 0 23px, #12161c 23px 24px);
}
.stage canvas {
  display: block; max-width: 100%; max-height: 100%; width: auto; height: auto;
  background: #000; box-shadow: 0 0 0 1px var(--line-2);
}
.drop {
  position: absolute; inset: 12px; border: 1px dashed var(--accent); display: flex; align-items: center; justify-content: center;
  background: rgba(8, 20, 26, .78); color: var(--accent); font-size: 14px; letter-spacing: .1em; pointer-events: none;
}
.status {
  display: flex; flex-wrap: wrap; gap: 4px 18px; padding-block: 8px; padding-inline: 16px;
  border-top: 1px solid var(--line); background: var(--panel); color: var(--muted);
  font-variant-numeric: tabular-nums; font-size: 11px; letter-spacing: .04em;
}
.status b { color: var(--fg); font-weight: 500; }
.status .src { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.status .recdot { color: var(--rec); }
.takes { display: flex; flex-direction: column; gap: 12px; padding-inline: 16px; padding-block: 0 16px; }
.takes:empty { display: none; }
.takes h3 { margin: 12px 0 0; font-size: 11px; color: var(--muted); letter-spacing: .12em; font-weight: 500; }
.take { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 12px; align-items: start; border: 1px solid var(--line); background: var(--panel); padding: 10px; }
.take video { width: 100%; max-height: 320px; background: #000; display: block; }
.take .meta { display: flex; flex-direction: column; gap: 6px; min-width: 0; font-variant-numeric: tabular-nums; }
.take .meta .note { color: var(--muted); font-size: 11px; }
.take a { color: var(--accent); }

.panel { min-height: 0; overflow: auto; border-left: 1px solid var(--line); background: var(--panel); padding-block: 4px 24px; padding-inline: 16px; }
.sec { border-bottom: 1px solid var(--line); padding-block: 14px; display: flex; flex-direction: column; gap: 10px; }
.sec:last-child { border-bottom: 0; }
.sec h2 { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .16em; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sec h2 .en { color: var(--dim); font-weight: 400; }
.row { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 8px; align-items: center; }
.row > label, .row > .lab { color: var(--muted); font-size: 11px; }
.hint { color: var(--dim); font-size: 11px; margin: 0; }
.seg { display: flex; flex-wrap: wrap; gap: 3px; }
.seg button {
  flex: 1 1 auto; min-width: 0; border: 1px solid var(--line-2); background: var(--panel-2); padding: 4px 6px; border-radius: 2px; font-size: 11px; white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 4px; }
.tile {
  aspect-ratio: 1.35; border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 2px; font-size: 11px;
  display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 6px; text-align: left; line-height: 1.2;
}
.tile i { font-style: normal; width: 8px; height: 8px; border: 1px solid var(--dim); display: block; }
.tile[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: #0f2129; }
.tile[aria-pressed="true"] i { background: var(--accent); border-color: var(--accent); }
.range { display: grid; grid-template-columns: minmax(0, 1fr) 44px; gap: 8px; align-items: center; }
.range output { text-align: right; font-variant-numeric: tabular-nums; color: var(--fg); font-size: 11px; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
select { background: var(--panel-2); border: 1px solid var(--line-2); padding: 4px 6px; border-radius: 2px; width: 100%; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.check { display: inline-flex; align-items: center; gap: 6px; color: var(--fg); font-size: 11px; cursor: pointer; }
.check input { accent-color: var(--accent); margin: 0; }
.swatches { display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 3px; }
.sw { aspect-ratio: 1; border: 1px solid var(--line-2); border-radius: 2px; padding: 0; }
.sw[aria-pressed="true"] { outline: 2px solid var(--fg); outline-offset: 1px; }
.sw.rainbow { background: conic-gradient(#f33, #fd3, #3f6, #3cf, #63f, #f3c, #f33); }
.filebtn { position: relative; overflow: hidden; display: inline-flex; align-items: center; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; }
.fontseg button[data-v="mono"] { font-family: "JetBrains Mono", monospace; }
.fontseg button[data-v="plex"] { font-family: "IBM Plex Mono", monospace; }
.fontseg button[data-v="term"] { font-family: VT323, monospace; font-size: 15px; line-height: 1; }
.fontseg button[data-v="pixel"] { font-family: Silkscreen, monospace; }
.fontseg button[data-v="arcade"] { font-family: "Press Start 2P", monospace; font-size: 8px; }

@media (max-width: 860px) {
  .main { grid-template-columns: minmax(0, 1fr); overflow: auto; }
  .app { height: auto; min-height: 100%; }
  .stage-col { overflow: visible; }
  .stage { min-height: 0; flex: none; }
  .panel { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .take { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { .btn, .tile { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="mark">BLOB<b>TRACE</b></span>
      <span class="sub">BLOB TRACKING · 全部在本機瀏覽器運算，不上傳任何檔案</span>
    </div>
    <div class="top-actions">
      <button class="btn primary" id="btnAll" type="button">一鍵全加</button>
      <button class="btn" id="btnReset" type="button">重設</button>
      <button class="btn rec" id="btnRec" type="button" aria-pressed="false">● 錄製</button>
    </div>
  </header>
  <main class="main">
    <section class="stage-col" aria-label="畫面">
      <div class="stage" id="stage">
        <canvas id="out" width="1280" height="720" aria-label="追蹤畫面"></canvas>
        <div class="drop" id="drop" hidden>放開以載入影片或圖片</div>
      </div>
      <div class="status" id="status" aria-live="off"></div>
      <div class="takes" id="takes"></div>
    </section>
    <aside class="panel" id="panel" aria-label="控制面板"></aside>
  </main>
</div>

<script>
(() => {
'use strict';

// ───────────────────────── 基本工具 ─────────────────────────
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const ctx2 = (c, rf) => c.getContext('2d', rf ? { willReadFrequently: true } : undefined);
function hash32(n) { n = Math.imul(n ^ (n >>> 16), 0x45d9f3b); n = Math.imul(n ^ (n >>> 16), 0x45d9f3b); return (n ^ (n >>> 16)) >>> 0; }
const hashPair = (a, b) => hash32(Math.imul(Math.min(a, b), 73856093) ^ Math.imul(Math.max(a, b), 19349663) ^ 0x9e3779b9);
const pad3 = n => String(n).padStart(3, '0');

const out = $('#out'), octx = ctx2(out, true);
const srcC = mk(1280, 720), srcX = ctx2(srcC, true);
const tmpC = mk(1280, 720), tmpX = ctx2(tmpC, true);
const regC = mk(1280, 720), regX = ctx2(regC, true);
const orgC = mk(1280, 720), orgX = ctx2(orgC, true);
const auxC = mk(1280, 720), auxX = ctx2(auxC, true);
const tinyC = mk(64, 64), tinyX = ctx2(tinyC, true);
const detC = mk(160, 90), detX = ctx2(detC, true);
const maskC = mk(160, 90), maskX = ctx2(maskC, true);
const demoC = mk(1280, 720), demoX = ctx2(demoC);
let W = 1280, H = 720;

// ───────────────────────── 設定 ─────────────────────────
const BASIC = [['basic', '基本'], ['cross', 'Cross'], ['label', '標籤'], ['frame', 'Frame'], ['lframe', 'L-Frame'], ['xframe', 'X-Frame'], ['grid', 'Grid'], ['particle', 'Particle'], ['dash', 'Dash'], ['scope', 'Scope'], ['win', 'Win2K'], ['label2', 'Label 2'], ['glow', 'Glow'], ['backdrop', 'Backdrop'], ['trail', 'Trail']];
const FILTERS = [['invert', '反轉'], ['glitch', 'Glitch'], ['thermal', 'Thermal'], ['pixel', 'Pixel'], ['tone', 'Tone'], ['blur', 'Blur'], ['dither', 'Dither'], ['zoom', 'Zoom'], ['xray', 'X-Ray'], ['water', 'Water'], ['mask', 'Mask'], ['crt', 'CRT'], ['edge', 'Edge'], ['dots', 'Dots']];
const FONTS = {
  mono: ['Mono', '"JetBrains Mono", ui-monospace, monospace', 1],
  plex: ['Plex', '"IBM Plex Mono", ui-monospace, monospace', 1],
  term: ['Terminal', 'VT323, ui-monospace, monospace', 1.4],
  pixel: ['Pixel', 'Silkscreen, ui-monospace, monospace', 1],
  arcade: ['Arcade', '"Press Start 2P", ui-monospace, monospace', 0.72],
};
const PALETTE = ['#ffffff', '#ff3b3b', '#ff7a1a', '#ffc21a', '#f4ff3a', '#9dff3a', '#2cff7a', '#1affd5', '#1ad1ff', '#3a8bff',
  '#5a4bff', '#a64bff', '#ff4bd8', '#ff4b8b', '#ff9aa8', '#ffd9a8', '#c9f0ff', '#b4b4b4', '#6e6e6e', '#00ff41'];
const RAINBOW = 20;
const SUGGEST = { bright: 160, dark: 60, motion: 28 };
const NS = [16, 32, 64, 128, 256, 512];
const WORDS = ['ECHO', 'NOVA', 'KILO', 'DELTA', 'SIGMA', 'ORBIT', 'VOID', 'FLUX', 'HALO', 'ZERO', 'OMNI', 'APEX', 'NODE', 'GRID', 'PULSE', 'VECTOR'];

const DEF = {
  mode: 'bright', th: 160, cmode: 'count', n: 32, single: false, bound: 0, same: false, pad: 6,
  basic: { basic: true, label: true, lframe: true, trail: true, dash: true },
  lstyle: 'straight', rate: 0.5, lw: 1,
  filters: {}, outside: false, blend: false, flicker: false,
  font: 'mono', lab: 'block', tpos: 'top', tmode: 'random', fsize: 12, text: true, color: 0, separate: false, crazy: false,
  tone: 'orig', contrast: 1, dots: 'none', dsize: 8, tear: 0, shift: 0, scan: 0,
  sound: false, voice: 'computer', vol: 0.5,
};
const fresh = () => JSON.parse(JSON.stringify(DEF));
let S = fresh();

// ───────────────────────── 來源 ─────────────────────────
let src = { kind: 'demo', name: 'DEMO · 內建示範', el: null };
let paused = false, demoT = 0, objURL = null;

function setSize(sw, sh) {
  const w = Math.min(1280, Math.round(sw)), h = Math.max(2, Math.round(sh * w / sw));
  if (w === W && h === H && out.width === w) return;
  W = w; H = h;
  for (const c of [out, srcC, tmpC, regC, orgC, auxC]) { c.width = W; c.height = H; }
  const dh = Math.max(2, Math.round(160 * H / W));
  detC.width = maskC.width = 160; detC.height = maskC.height = dh;
  resetTracking();
}

function loadFile(file) {
  if (!file) return;
  const isVid = file.type.startsWith('video/'), isImg = file.type.startsWith('image/');
  if (!isVid && !isImg) { toast('只支援影片或圖片檔'); return; }
  if (objURL) URL.revokeObjectURL(objURL);
  if (src.kind === 'video' && src.el) src.el.pause();
  objURL = URL.createObjectURL(file);
  if (isVid) {
    const v = document.createElement('video');
    v.muted = true; v.loop = true; v.playsInline = true; v.autoplay = true; v.src = objURL;
    v.addEventListener('loadedmetadata', () => { setSize(v.videoWidth, v.videoHeight); resetTracking(); });
    v.play().catch(() => {});
    src = { kind: 'video', name: file.name, el: v };
  } else {
    const im = new Image();
    im.onload = () => { setSize(im.naturalWidth, im.naturalHeight); resetTracking(); };
    im.src = objURL;
    src = { kind: 'image', name: file.name, el: im };
  }
  paused = false; syncAll();
}

function backToDemo() {
  if (src.kind === 'video' && src.el) src.el.pause();
  if (objURL) { URL.revokeObjectURL(objURL); objURL = null; }
  src = { kind: 'demo', name: 'DEMO · 內建示範', el: null };
  paused = false; setSize(1280, 720); resetTracking(); syncAll();
}

function togglePause() {
  paused = !paused;
  if (src.kind === 'video' && src.el) { if (paused) src.el.pause(); else src.el.play().catch(() => {}); }
  syncAll();
}

// 內建示範：光球、跳舞的人形、地面透視格線
const ORBS = [
  { r: 46, c: [255, 210, 150], ax: 430, ay: 150, fx: 0.31, fy: 0.47, px: 0, py: 1 },
  { r: 34, c: [150, 220, 255], ax: 520, ay: 120, fx: 0.23, fy: 0.61, px: 2, py: 0.4 },
  { r: 28, c: [255, 150, 210], ax: 380, ay: 170, fx: 0.43, fy: 0.29, px: 4, py: 2.2 },
  { r: 40, c: [200, 255, 170], ax: 470, ay: 90, fx: 0.17, fy: 0.53, px: 1.3, py: 3.1 },
  { r: 22, c: [255, 255, 255], ax: 560, ay: 190, fx: 0.52, fy: 0.37, px: 5, py: 0.2 },
];
function drawDemo(t) {
  const x = demoX, w = 1280, h = 720, hz = 380, vx = 640;
  const g = x.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#04050a'); g.addColorStop(0.53, '#0b0e17'); g.addColorStop(1, '#07080c');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  // 地面格線（較暗，不會被亮部模式抓到）
  x.save(); x.strokeStyle = 'rgba(110,135,170,0.42)'; x.lineWidth = 1.2;
  for (let k = -14; k <= 14; k++) { x.beginPath(); x.moveTo(vx, hz); x.lineTo(vx + k * 170, h + 40); x.stroke(); }
  const ph = (t * 0.35) % 1;
  for (let i = 0; i < 14; i++) {
    const u = (i + ph) / 14, y = hz + (h - hz) * u * u;
    x.globalAlpha = 0.25 + 0.75 * u; x.beginPath(); x.moveTo(0, y); x.lineTo(w, y); x.stroke();
  }
  x.globalAlpha = 1;
  const hg = x.createLinearGradient(0, hz - 60, 0, hz + 6);
  hg.addColorStop(0, 'rgba(90,120,170,0)'); hg.addColorStop(1, 'rgba(90,120,170,0.28)');
  x.fillStyle = hg; x.fillRect(0, hz - 60, w, 66);
  x.restore();
  // 光球
  for (const o of ORBS) {
    const cx = 640 + o.ax * Math.sin(t * o.fx * 2 + o.px), cy = 250 + o.ay * Math.sin(t * o.fy * 2 + o.py);
    const rg = x.createRadialGradient(cx, cy, 0, cx, cy, o.r * 2.2);
    rg.addColorStop(0, 'rgba(255,255,255,1)');
    rg.addColorStop(0.28, `rgba(${o.c[0]},${o.c[1]},${o.c[2]},1)`);
    rg.addColorStop(0.5, `rgba(${o.c[0]},${o.c[1]},${o.c[2]},0.35)`);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = rg; x.beginPath(); x.arc(cx, cy, o.r * 2.2, 0, Math.PI * 2); x.fill();
  }
  // 跳舞的人形
  const bx = 640 + Math.sin(t * 0.9) * 180, bounce = Math.abs(Math.sin(t * 3.2)) * 18;
  const hip = [bx, 470 - bounce], lean = Math.sin(t * 1.6) * 0.18;
  const neck = [hip[0] + Math.sin(lean) * 120, hip[1] - Math.cos(lean) * 120];
  const limb = (p, a1, l1, a2, l2) => { const k = [p[0] + Math.sin(a1) * l1, p[1] + Math.cos(a1) * l1]; return [k, [k[0] + Math.sin(a1 + a2) * l2, k[1] + Math.cos(a1 + a2) * l2]]; };
  const s1 = Math.sin(t * 3.2), s2 = Math.sin(t * 3.2 + Math.PI);
  const armL = limb(neck, -2.3 + s1 * 0.9, 62, 0.9 + s1 * 0.6, 58), armR = limb(neck, 2.3 + s2 * 0.9, 62, -0.9 + s2 * 0.6, 58);
  const legL = limb(hip, -0.35 + s1 * 0.45, 78, 0.35 + Math.max(0, s1) * 0.7, 76), legR = limb(hip, 0.35 + s2 * 0.45, 78, -0.35 - Math.max(0, s2) * 0.7, 76);
  x.save(); x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = '#f3efe6'; x.shadowColor = 'rgba(255,240,220,0.6)'; x.shadowBlur = 18;
  const poly = (pts, lw) => { x.lineWidth = lw; x.beginPath(); x.moveTo(pts[0][0], pts[0][1]); for (const p of pts.slice(1)) x.lineTo(p[0], p[1]); x.stroke(); };
  poly([hip, neck], 30);
  poly([neck, ...armL], 18); poly([neck, ...armR], 18);
  poly([hip, ...legL], 22); poly([hip, ...legR], 22);
  x.fillStyle = '#f3efe6'; x.beginPath(); x.arc(neck[0] + Math.sin(lean) * 34, neck[1] - Math.cos(lean) * 34, 25, 0, Math.PI * 2); x.fill();
  x.restore();
  // 影子
  x.fillStyle = 'rgba(0,0,0,0.5)'; x.beginPath(); x.ellipse(bx, 632, 80 - bounce, 12, 0, 0, Math.PI * 2); x.fill();
}

function drawSource() {
  if (src.kind === 'demo') { drawDemo(demoT); srcX.drawImage(demoC, 0, 0, W, H); return true; }
  const el = src.el;
  if (src.kind === 'video') { if (el.readyState < 2 || !el.videoWidth) return false; srcX.drawImage(el, 0, 0, W, H); return true; }
  if (src.kind === 'image') { if (!el.complete || !el.naturalWidth) return false; srcX.drawImage(el, 0, 0, W, H); return true; }
  return false;
}

// ───────────────────────── 偵測 ─────────────────────────
let prevLum = null, mask = null, maskW = 160, maskH = 90;
function resetTracking() { prevLum = null; tracks = []; parts = []; }

function detect() {
  const w = detC.width, h = detC.height, n = w * h;
  detX.drawImage(srcC, 0, 0, w, h);
  const d = detX.getImageData(0, 0, w, h).data;
  const lum = new Uint8ClampedArray(n);
  for (let i = 0, j = 0; i < n; i++, j += 4) lum[i] = (d[j] * 0.299 + d[j + 1] * 0.587 + d[j + 2] * 0.114) | 0;
  let m = new Uint8Array(n);
  const th = S.th;

  note.remove();
  const b = document.createElement('button'); b.type = 'button'; b.className = 'btn small'; b.textContent = `下載 ${name}`;
  b.addEventListener('click', async () => {
    try { await dl.save({ filename: name, data: blob }); toast('已交給瀏覽器下載'); }
    catch (e) {
      const c = e && e.code;
      if (c === 'declined') return;
      if (c === 'rate_limited') { toast('已有一個下載確認視窗，請先處理它'); return; }
      toast('這個視窗無法下載，請在影片上按右鍵「另存影片」'); b.remove(); meta.append(note);
    }
  });
  meta.append(b);
}

// ───────────────────────── 主迴圈 ─────────────────────────
let last = performance.now(), fps = 60, lastBoxes = [], flashK = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  fps = fps * 0.92 + (1 / Math.max(dt, 1e-3)) * 0.08;
  T = now / 1000;
  if (!paused) demoT += dt;
  if (!drawSource()) { drawStatus(); return; }
  const dets = detect();
  const vis = track(dets, dt);
  const boxes = vis.map(t => ({ t, r: boxOf(t), c: colorOf(t), hide: S.flicker && Math.random() < 0.14, skip: S.flicker && Math.random() < 0.25 }));
  lastBoxes = boxes;
  octx.drawImage(srcC, 0, 0);
  if (S.tone !== 'orig' || S.contrast !== 1) applyTone();
  if (S.dots !== 'none') applyDots();
  applyBoxFilters(boxes);
  if (S.tear > 0) applyTear();
  if (S.shift > 0) applyShift();
  if (S.basic.backdrop) drawBackdrop(boxes);
  drawLinks(boxes);
  if (S.basic.trail) drawTrails(boxes);
  updateParticles(boxes, paused ? 0 : dt);
  drawBoxes(boxes);
  drawLabels(boxes);
  if (S.scan > 0) drawScan();
  if (S.flicker && Math.random() < 0.012) flashK = 1;
  if (flashK > 0.02) { octx.fillStyle = `rgba(255,255,255,${flashK * 0.85})`; octx.fillRect(0, 0, W, H); flashK *= 0.45; } else flashK = 0;
  drawStatus();
}

let statusTick = 0;
function fxCount() {
  let n = Object.values(S.basic).filter(Boolean).length + Object.values(S.filters).filter(Boolean).length;
  if (S.tone !== 'orig') n++; if (S.dots !== 'none') n++; if (S.tear > 0) n++; if (S.shift > 0) n++; if (S.scan > 0) n++;
  return n;
}
function drawStatus() {
  const now = performance.now(); if (now - statusTick < 200) return; statusTick = now;
  const recS = rec ? `<span class="recdot">● REC ${((now - recT0) / 1000).toFixed(1)}s</span>` : '';
  $('#status').innerHTML = `<span>BLOBS <b>${lastBoxes.length}</b></span><span>FPS <b>${Math.round(fps)}</b></span><span>RES <b>${W}×${H}</b></span><span>FX <b>${fxCount()}</b></span>${recS}<span class="src">SRC <b>${escapeHtml(src.name)}</b>${paused ? ' · 暫停中' : ''}</span>`;
}
const escapeHtml = s => s.replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

let toastT = null;
function toast(msg) {
  const st = $('#status'); let el = document.getElementById('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.style.cssText = 'position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1b222a;border:1px solid #313944;color:#dde3ea;padding:8px 14px;font:12px var(--f-ui);z-index:10;max-width:calc(100% - 32px)'; document.body.append(el); }
  el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 2600);
}

// ───────────────────────── 控制面板 ─────────────────────────
const panel = $('#panel'), binds = [];
const syncAll = () => { for (const f of binds) f(); drawStatus(); };
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function section(title, en) { const s = el('section', 'sec'); s.append(el('h2', null, `<span>${title}</span><span class="en">${en}</span>`)); panel.append(s); return s; }
function row(parent, label, ctrl, forId) { const r = el('div', 'row'); const l = el(forId ? 'label' : 'span', 'lab', label); if (forId) l.htmlFor = forId; r.append(l, ctrl); parent.append(r); return r; }
function seg(id, get, set, opts, cls) {
  const d = el('div', 'seg' + (cls ? ' ' + cls : '')); d.id = id; d.setAttribute('role', 'group');
  for (const [v, lab] of opts) {
    const b = el('button', null, lab); b.type = 'button'; b.dataset.v = v;
    b.addEventListener('click', () => { set(v); syncAll(); });
    d.append(b);
  }
  binds.push(() => { for (const b of d.children) b.setAttribute('aria-pressed', String(String(get()) === b.dataset.v)); });
  return d;
}
function range(id, key, min, max, step, fmt) {
  const d = el('div', 'range'), i = el('input'), o = el('output');
  i.type = 'range'; i.id = id; i.min = min; i.max = max; i.step = step;
  i.addEventListener('input', () => { S[key] = parseFloat(i.value); o.textContent = fmt ? fmt(S[key]) : S[key]; });
  binds.push(() => { i.value = S[key]; o.textContent = fmt ? fmt(S[key]) : S[key]; });
  d.append(i, o); return d;
}
function check(id, label, get, set) {
  const l = el('label', 'check'), i = el('input'); i.type = 'checkbox'; i.id = id;
  i.addEventListener('change', () => { set(i.checked); syncAll(); });
  binds.push(() => { i.checked = !!get(); });
  l.append(i, document.createTextNode(label)); return l;
}
function tiles(id, list, obj) {
  const d = el('div', 'tiles'); d.id = id;
  for (const [k, lab] of list) {
    const b = el('button', 'tile', `<i aria-hidden="true"></i><span>${lab}</span>`); b.type = 'button'; b.dataset.k = k;
    b.addEventListener('click', () => { S[obj][k] = !S[obj][k]; syncAll(); });
    d.append(b);
  }
  binds.push(() => { for (const b of d.children) b.setAttribute('aria-pressed', String(!!S[obj][b.dataset.k])); });
  return d;
}

function buildPanel() {
  // 來源
  let s = section('來源', 'SOURCE');
  const br = el('div', 'btnrow');
  const fb = el('label', 'btn filebtn', '上傳影片／圖片'); const fi = el('input'); fi.type = 'file'; fi.id = 'fileIn'; fi.accept = 'video/*,image/*';
  fi.addEventListener('change', () => { loadFile(fi.files[0]); fi.value = ''; }); fb.append(fi);
  const bp = el('button', 'btn'); bp.type = 'button'; bp.id = 'btnPause'; bp.addEventListener('click', togglePause);
  binds.push(() => { bp.textContent = paused ? '播放' : '暫停'; });
  const bd = el('button', 'btn', '回到示範影像'); bd.type = 'button'; bd.id = 'btnDemo'; bd.addEventListener('click', backToDemo);
  br.append(fb, bp, bd); s.append(br);
  s.append(el('p', 'hint', '也可以把檔案直接拖曳到畫面上。影片靜音並重複播放；處理畫面最寬 1280px，偵測用 160 格寬的縮圖。'));

  // 偵測與追蹤
  s = section('偵測與追蹤', 'DETECT');
  row(s, '追蹤依據', seg('segMode', () => S.mode, v => { S.mode = v; S.th = SUGGEST[v]; resetTracking(); }, [['bright', '亮部'], ['dark', '暗部'], ['motion', '動態']]));
  row(s, '閾值', range('rTh', 'th', 1, 254, 1), 'rTh');
  const nc = el('div'); nc.style.cssText = 'display:grid;grid-template-columns:minmax(0,1fr) 72px;gap:6px';
  const nsel = el('select'); nsel.id = 'selN'; for (const n of NS) nsel.append(new Option(String(n), String(n)));
  nsel.addEventListener('change', () => { S.n = parseInt(nsel.value, 10); syncAll(); }); binds.push(() => { nsel.value = String(S.n); });
  nc.append(seg('segCmode', () => S.cmode, v => { S.cmode = v; }, [['size', '按大小'], ['count', '按數量']]), nsel);
  row(s, 'Blob 數量', nc);
  s.append(el('p', 'hint', '按大小：只留面積 ≥ N px²；按數量：由大到小最多留 N 個。'));
  row(s, '邊界大小', range('rBound', 'bound', 0, 240, 4, v => v === 0 ? '自動' : v), 'rBound');
  row(s, '框線外擴', range('rPad', 'pad', 0, 40, 1, v => v + 'px'), 'rPad');
  const c1 = el('div', 'checks');
  c1.append(check('cSingle', '單一追蹤（只追最大）', () => S.single, v => { S.single = v; }), check('cSame', '相同大小', () => S.same, v => { S.same = v; }));
  s.append(c1);

  // 基本效果
  s = section('基本效果', 'BOX FX');
  const allB = el('button', 'btn small', '全選'); allB.type = 'button'; allB.id = 'allBasic';
  allB.addEventListener('click', () => { const on = !BASIC.every(([k]) => S.basic[k]); for (const [k] of BASIC) S.basic[k] = on; syncAll(); });
  binds.push(() => { allB.textContent = BASIC.every(([k]) => S.basic[k]) ? '全部取消' : '全選'; });
  s.querySelector('h2').append(allB);
  s.append(tiles('tilesBasic', BASIC, 'basic'));

  // 連線
  s = section('連線', 'LINKS');
  row(s, '線條樣式', seg('segLine', () => S.lstyle, v => { S.lstyle = v; }, [['straight', '直線'], ['curve', '曲線'], ['wave', '波浪'], ['lightning', '閃電']]));
  row(s, '連線率', seg('segRate', () => S.rate, v => { S.rate = parseFloat(v); }, [['0', '0'], ['0.25', '.25'], ['0.5', '.5'], ['0.75', '.75'], ['1', '1']]));
  row(s, '線條寬度', range('rLw', 'lw', 0.5, 8, 0.5, v => v + 'px'), 'rLw');
  const c2 = el('div', 'checks'); c2.append(check('cDash', '虛線（與 Dash 連動）', () => S.basic.dash, v => { S.basic.dash = v; })); s.append(c2);

  // 濾鏡效果
  s = section('濾鏡效果', 'FILTERS');
  const allF = el('button', 'btn small', '全選'); allF.type = 'button'; allF.id = 'allFilters';
  allF.addEventListener('click', () => { const on = !FILTERS.every(([k]) => S.filters[k]); for (const [k] of FILTERS) S.filters[k] = on; syncAll(); });
  binds.push(() => { allF.textContent = FILTERS.every(([k]) => S.filters[k]) ? '全部取消' : '全選'; });
  s.querySelector('h2').append(allF);
  s.append(tiles('tilesFilters', FILTERS, 'filters'));
  const c3 = el('div', 'checks');
  c3.append(check('cOutside', '反轉（改套在框外）', () => S.outside, v => { S.outside = v; }), check('cBlend', '融合', () => S.blend, v => { S.blend = v; }), check('cFlicker', '閃爍', () => S.flicker, v => { S.flicker = v; }));
  s.append(c3);
  s.append(el('p', 'hint', 'Tone 用下方調色盤選的顏色做雙色調。'));

  // 顏色與文字
  s = section('顏色與文字', 'COLOR · TEXT');
  row(s, '字型', seg('segFont', () => S.font, v => { S.font = v; }, Object.entries(FONTS).map(([k, f]) => [k, f[0]]), 'fontseg'));
  row(s, '標籤樣式', seg('segLab', () => S.lab, v => { S.lab = v; }, [['block', '色塊'], ['outline', '外框'], ['plain', '純文字']]));
  row(s, '文字位置', seg('segTpos', () => S.tpos, v => { S.tpos = v; }, [['center', '中心'], ['top', '頂部'], ['bottom', '底部']]));
  row(s, '文字內容', seg('segTmode', () => S.tmode, v => { S.tmode = v; }, [['random', '隨機'], ['pos', '位置'], ['count', '數量']]));
  row(s, '字型大小', seg('segFs', () => S.fsize, v => { S.fsize = parseInt(v, 10); }, [['10', '10'], ['12', '12'], ['16', '16'], ['18', '18'], ['20', '20']]));
  const sw = el('div', 'swatches'); sw.id = 'swatches';
  PALETTE.forEach((hx, i) => { const b = el('button', 'sw'); b.type = 'button'; b.style.background = hx; b.title = hx; b.setAttribute('aria-label', `顏色 ${hx}`); b.addEventListener('click', () => { S.color = i; syncAll(); }); sw.append(b); });
  const rb = el('button', 'sw rainbow'); rb.type = 'button'; rb.title = '彩虹輪轉'; rb.setAttribute('aria-label', '彩虹輪轉'); rb.addEventListener('click', () => { S.color = RAINBOW; syncAll(); }); sw.append(rb);
  binds.push(() => { [...sw.children].forEach((b, i) => b.setAttribute('aria-pressed', String(i === S.color))); });
  row(s, '調色盤', sw);
  const c4 = el('div', 'checks');
  c4.append(check('cText', '文字', () => S.text, v => { S.text = v; }), check('cSep', '分離顏色', () => S.separate, v => { S.separate = v; }), check('cCrazy', '瘋狂', () => S.crazy, v => { S.crazy = v; }));
  s.append(c4);

  // 全畫面效果
  s = section('全畫面效果', 'SCREEN');
  row(s, '色調', seg('segTone', () => S.tone, v => { S.tone = v; }, [['orig', '原色'], ['bw', '黑白'], ['hc', '高對比'], ['1bit', '1-bit']]));
  row(s, '對比', range('rCon', 'contrast', 0.5, 4, 0.1, v => v.toFixed(1)), 'rCon');
  row(s, '點陣', seg('segDots', () => S.dots, v => { S.dots = v; }, [['none', '無'], ['halftone', '網點'], ['led', 'LED'], ['lines', '線條']]));
  row(s, '點陣大小', range('rDs', 'dsize', 3, 24, 1, v => v + 'px'), 'rDs');
  row(s, '畫面撕裂', range('rTear', 'tear', 0, 1, 0.05, v => v.toFixed(2)), 'rTear');
  row(s, '色偏', range('rShift', 'shift', 0, 20, 1, v => v + 'px'), 'rShift');
  row(s, '掃描線', range('rScan', 'scan', 0, 0.8, 0.05, v => v.toFixed(2)), 'rScan');

  // 音訊
  s = section('音訊', 'AUDIO');
  const c5 = el('div', 'checks');
  c5.append(check('cSound', '聲音（新斑點出現時響一聲）', () => S.sound, v => { S.sound = v && ensureAudio(); }));
  s.append(c5);
  row(s, '音色', seg('segVoice', () => S.voice, v => { if (v === 'custom' && !customBuf) { toast('請先上傳音效檔'); return; } S.voice = v; }, [['computer', 'Computer'], ['beep', 'Beep'], ['bird', 'Bird'], ['custom', '自訂']]));
  const sb = el('label', 'btn small filebtn', '上傳音效'); const si = el('input'); si.type = 'file'; si.id = 'sndIn'; si.accept = 'audio/*';
  si.addEventListener('change', () => { loadSound(si.files[0]); si.value = ''; }); sb.append(si);
  const sn = el('span', 'hint'); binds.push(() => { sn.textContent = customBuf ? customName : '每次播放開頭最多 1.2 秒'; });
  const sw2 = el('div', 'btnrow'); sw2.style.alignItems = 'center'; sw2.append(sb, sn);
  row(s, '自訂音效', sw2);
  const vr = range('rVol', 'vol', 0, 1, 0.05, v => Math.round(v * 100) + '%');
  vr.querySelector('input').addEventListener('input', () => { if (master) master.gain.value = S.vol; });
  row(s, '音量', vr, 'rVol');
}

function allIn() {
  for (const [k] of BASIC) S.basic[k] = true;
  for (const [k] of FILTERS) S.filters[k] = true;
  Object.assign(S, { tone: 'hc', dots: 'halftone', lstyle: 'lightning', rate: 1, font: 'pixel', crazy: true, blend: true, flicker: true, tear: 0.45 });
  syncAll(); toast('已開啟全部效果');
}
function resetAll() {
  const keepSound = false; S = fresh(); S.sound = keepSound;
  if (master) master.gain.value = S.vol;
  syncAll(); toast('已回到預設值');
}

// ───────────────────────── 事件 ─────────────────────────
$('#btnAll').addEventListener('click', allIn);
$('#btnReset').addEventListener('click', resetAll);
$('#btnRec').addEventListener('click', () => { if (rec) stopRec(); else startRec(); });
binds.push(() => { const b = $('#btnRec'); b.setAttribute('aria-pressed', String(!!rec)); b.textContent = rec ? '■ 停止錄製' : '● 錄製'; });

const stage = $('#stage'), drop = $('#drop');
let dragN = 0;
stage.addEventListener('dragenter', e => { e.preventDefault(); dragN++; drop.hidden = false; });
stage.addEventListener('dragover', e => { e.preventDefault(); });
stage.addEventListener('dragleave', () => { dragN = Math.max(0, dragN - 1); if (!dragN) drop.hidden = true; });
stage.addEventListener('drop', e => { e.preventDefault(); dragN = 0; drop.hidden = true; const f = e.dataTransfer && e.dataTransfer.files[0]; if (f) loadFile(f); });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => e.preventDefault());

buildPanel();
setSize(1280, 720);
syncAll();
requestAnimationFrame(frame);
window.__blobtrace = { get S() { return S; }, allIn, resetAll, startRec, stopRec, get boxes() { return lastBoxes; } };
})();
</script>
